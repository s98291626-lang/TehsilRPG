<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Təhsil RPG Oyunu</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase SDK (Realtime Database üçün) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; transition: all 0.25s ease; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            text-align: center;
            padding: 20px 12px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 24, 38, 0.95);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .player-badge { background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #38bdf8; }
        .leaderboard-btn { background: #d97706; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        h2 { color: #f59e0b; margin-top: 0; }
        .stats { background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 14px; margin-bottom: 20px; display: flex; justify-content: space-around; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; outline: none; }
        input { background: #1e293b; color: #fff; border: 1px solid #334155; }
        button { background: #059669; color: white; font-weight: 600; cursor: pointer; }
        .box { background: rgba(15, 23, 42, 0.5); padding: 16px; margin-top: 16px; border-radius: 14px; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .alert-card { background: #1e293b; padding: 22px; border-radius: 18px; width: 90%; max-width: 360px; }
        .leaderboard-list { max-height: 250px; overflow-y: auto; margin: 15px 0; text-align: left; }
        .lb-item { display: flex; justify-content: space-between; background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; margin-bottom: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="player-badge">👤 <span id="playerNameDisplay">---</span></div>
        <button class="leaderboard-btn" onclick="liderleriAc()">🏆 Canlı Liderlər</button>
    </div>

    <h2>🎯 Təhsil RPG</h2>
    
    <div class="stats">
        <span>🪙 <span id="coinCount">0</span></span>
        <span>❤️ <span id="hpCount">100</span></span>
        <span>⚔️ <span id="dmgCount">10</span></span>
    </div>

    <div class="box">
        <h3>👹 Boss Lvl <span id="bossLvl">1</span></h3>
        <p>🔴 Can: <span id="bossHp">30</span> | 💥 Hasar: <span id="bossDmg">10</span></p>
        <button onclick="bossSavasi()" style="background: #dc2626;">⚔️ Boss ilə Savaş!</button>
    </div>

    <button onclick="sifirla()" style="background: #7f1d1d; margin-top: 15px;">🔄 Hesabı Sıfırla</button>
</div>

<!-- AD DAXİL ET MƏRHƏLƏSİ -->
<div id="welcome-modal" class="modal-overlay hidden">
    <div class="alert-card">
        <h3>🎮 Oyuna Başla</h3>
        <p>İstifadəçi adınızı yazın:</p>
        <input type="text" id="playerNameInput" placeholder="Nick name...">
        <button onclick="oyuncuGiris()">Təsdiqlə</button>
    </div>
</div>

<!-- CANLI LİDERLƏR LÖVHƏSİ -->
<div id="leaderboard-modal" class="modal-overlay hidden">
    <div class="alert-card">
        <h3>🏆 Qlobal Liderlər</h3>
        <div class="leaderboard-list" id="lbListArea">Yüklənir...</div>
        <button onclick="liderleriBagla()" style="background: #475569;">Bağla</button>
    </div>
</div>

<script>
    // --- FIREBASE KONFİQURASİYASI (Öz məlumatlarınızla dəyişin) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase-i başladırıq
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerName = localStorage.getItem('rpg_player_name') || "";
    let bossLvl = parseInt(localStorage.getItem('rpg_boss_lvl')) || 1;
    let coin = parseInt(localStorage.getItem('rpg_coin')) || 0;
    let hp = parseInt(localStorage.getItem('rpg_hp')) || 100;
    let dmg = parseInt(localStorage.getItem('rpg_dmg')) || 10;
    let bossHp = 30 + (bossLvl - 1) * 20;
    let bossDmg = 10 + (bossLvl - 1) * 5;

    window.onload = function() {
        if (!playerName) {
            document.getElementById('welcome-modal').classList.remove('hidden');
        } else {
            document.getElementById('playerNameDisplay').innerText = playerName;
            bazayaYaz();
        }
        uiYenile();
        canliLiderleriDinle();
    };

    function oyuncuGiris() {
        let name = document.getElementById('playerNameInput').value.trim();
        if (!name) return alert("Ad yazın!");

        // Serverdə adın olub-olmadığını yoxlayırıq
        db.ref('players/' + name).once('value', snapshot => {
            if (snapshot.exists()) {
                alert("Bu ad artıq götürülüb! Başqa ad seçin.");
            } else {
                playerName = name;
                localStorage.setItem('rpg_player_name', playerName);
                document.getElementById('playerNameDisplay').innerText = playerName;
                document.getElementById('welcome-modal').classList.add('hidden');
                bazayaYaz();
            }
        });
    }

    function bazayaYaz() {
        if (!playerName) return;
        // Məlumatları həm brauzerdə, həm də Firebase serverində saxlayırıq
        localStorage.setItem('rpg_boss_lvl', bossLvl);
        localStorage.setItem('rpg_coin', coin);
        localStorage.setItem('rpg_hp', hp);
        localStorage.setItem('rpg_dmg', dmg);

        db.ref('players/' + playerName).set({
            name: playerName,
            bossLvl: bossLvl,
            lastSeen: Date.now()
        });
    }

    function canliLiderleriDinle() {
        // Firebase-dən real-vaxt rejimində sıralamanı çəkirik
        db.ref('players').orderByChild('bossLvl').on('value', snapshot => {
            let listArea = document.getElementById('lbListArea');
            listArea.innerHTML = "";
            let players = [];

            snapshot.forEach(child => {
                players.push(child.val());
            });

            // Yüksəkdən aşağıya sıralama
            players.reverse();

            players.forEach((p, index) => {
                listArea.innerHTML += `
                    <div class="lb-item">
                        <span><b>${index + 1}.</b> ${p.name}</span>
                        <span style="color:#f59e0b;">Lvl ${p.bossLvl}</span>
                    </div>
                `;
            });
        });
    }

    function bossSavasi() {
        if (dmg >= bossHp) {
            bossLvl++;
            coin += 50;
            bossHp += 20;
            bossDmg += 5;
            alert("Boss məğlub edildi!");
            bazayaYaz();
            uiYenile();
        } else {
            alert("Gücünüz çatmır!");
        }
    }

    function sifirla() {
        if (confirm("Hesabı sıfırlayıb adı silmək istəyirsiniz?")) {
            if (playerName) {
                db.ref('players/' + playerName).remove(); // Serverdən adı silirik
            }
            localStorage.clear();
            location.reload();
        }
    }

    function uiYenile() {
        document.getElementById('coinCount').innerText = coin;
        document.getElementById('hpCount').innerText = hp;
        document.getElementById('dmgCount').innerText = dmg;
        document.getElementById('bossLvl').innerText = bossLvl;
        document.getElementById('bossHp').innerText = bossHp;
        document.getElementById('bossDmg').innerText = bossDmg;
    }

    function liderleriAc() { document.getElementById('leaderboard-modal').classList.remove('hidden'); }
    function liderleriBagla() { document.getElementById('leaderboard-modal').classList.add('hidden'); }
</script>
</body>
</html>
