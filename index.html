<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehsil RPG</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e293b; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-reset { background: #ef4444; margin-top: 15px; }
        .hidden { display: none !important; }
        .stat-box { background: #334155; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <!-- İŞTİRAKÇI DAXİL OLMA EKRANI -->
    <div id="login-screen">
        <h2>🎮 Tehsil RPG</h2>
        <p>Xarakterinizin adını daxil edin:</p>
        <input type="text" id="usernameInput" placeholder="Məs: Qəhrəman" autocomplete="off">
        <button id="startBtn">Oyuna Başla</button>
    </div>

    <!-- OYUN ƏSAS EKRANI -->
    <div id="game-screen" class="hidden">
        <h2>👤 <span id="displayName"></span></h2>
        <div class="stat-box">
            <p>🪙 Qızıl: <strong id="coinVal" style="color:#facc15">0</strong></p>
            <p>⚔️ Səviyyə (Level): <strong id="levelVal" style="color:#4ade80">1</strong></p>
        </div>
        <button id="attackBtn">⚔️ Hücum Et (+50 Qızıl)</button>
        <button id="resetBtn" class="btn-reset">🔄 Sıfırla və Çıx</button>
    </div>
</div>

<script>
    // Əgər localStorage köhnə/səhv data saxlayıbsa təmizləyək
    try {
        const startBtn = document.getElementById('startBtn');
        const attackBtn = document.getElementById('attackBtn');
        const resetBtn = document.getElementById('resetBtn');

        let player = {
            name: localStorage.getItem('rpg_name') || '',
            coin: parseInt(localStorage.getItem('rpg_coin')) || 0,
            level: parseInt(localStorage.getItem('rpg_lvl')) || 1
        };

        function init() {
            if (player.name) {
                showGame();
            }
        }

        startBtn.onclick = function() {
            const inputName = document.getElementById('usernameInput').value.trim();
            if (!inputName) {
                alert("Zəhmət olmasa ad yazın!");
                return;
            }
            player.name = inputName;
            localStorage.setItem('rpg_name', player.name);
            localStorage.setItem('rpg_coin', player.coin);
            localStorage.setItem('rpg_lvl', player.level);
            showGame();
        };

        attackBtn.onclick = function() {
            player.coin += 50;
            if (player.coin % 200 === 0) {
                player.level += 1;
                alert("Təbrik! Səviyyə qaldırdınız: Level " + player.level);
            }
            localStorage.setItem('rpg_coin', player.coin);
            localStorage.setItem('rpg_lvl', player.level);
            updateUI();
        };

        resetBtn.onclick = function() {
            if (confirm("Bütün tərəqqiniz silinsin?")) {
                localStorage.clear();
                location.reload();
            }
        };

        function showGame() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            updateUI();
        }

        function updateUI() {
            document.getElementById('displayName').innerText = player.name;
            document.getElementById('coinVal').innerText = player.coin;
            document.getElementById('levelVal').innerText = player.level;
        }

        init();
    } catch (e) {
        alert("Xəta baş verdi, yaddaş sıfırlanır...");
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
