<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Təhsil RPG Oyunu</title>
    <!-- Konfetti (Qələbə effekti) Kitabxanası -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; transition: all 0.25s ease; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            text-align: center;
            padding: 20px 12px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 24, 38, 0.95);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .player-badge { background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
        .leaderboard-btn { background: #d97706; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .leaderboard-btn:active { transform: scale(0.95); }
        h2 { color: #f59e0b; margin-top: 0; font-size: 26px; }
        .stats { background: rgba(255, 255, 255, 0.03); padding: 14px; border-radius: 14px; margin-bottom: 20px; display: flex; justify-content: space-around; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stats span { font-weight: bold; font-size: 16px; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; outline: none; font-size: 15px; }
        input { background: #1e293b; color: #fff; border: 1px solid #334155; }
        button { background: #059669; color: white; font-weight: 600; cursor: pointer; }
        button:active { transform: scale(0.98); }
        .box { background: rgba(15, 23, 42, 0.5); padding: 16px; margin-top: 16px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .alert-card { background: #1e293b; padding: 22px; border-radius: 18px; width: 90%; max-width: 360px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .leaderboard-list { max-height: 250px; overflow-y: auto; margin: 15px 0; text-align: left; }
        .lb-item { display: flex; justify-content: space-between; background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; margin-bottom: 6px; }
        .hidden { display: none !important; }
        .btn-danger { background: #dc2626 !important; }
        .btn-upgrade { background: #2563eb !important; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="player-badge">👤 <span id="playerNameDisplay">---</span></div>
        <button class="leaderboard-btn" onclick="liderleriAc()">🏆 Liderlər</button>
    </div>

    <h2>🎯 Təhsil RPG</h2>
    
    <div class="stats">
        <span>🪙 <span id="coinCount">0</span></span>
        <span>❤️ <span id="hpCount">100</span></span>
        <span>⚔️ <span id="dmgCount">10</span></span>
    </div>

    <button class="btn-upgrade" onclick="gucArtir()">⚡ Gücünü Artır (Qiymət: 50 Qızıl)</button>

    <div class="box">
        <h3>👹 Boss Lvl <span id="bossLvl">1</span></h3>
        <p>🔴 Boss Canı: <span id="bossHp">30</span> | 💥 Hasarı: <span id="bossDmg">10</span></p>
        <button onclick="bossSavasi()" class="btn-danger">⚔️ Boss ilə Savaş!</button>
    </div>

    <button onclick="sifirla()" style="background: #7f1d1d; margin-top: 20px;">🔄 Hesabı Sıfırla</button>
</div>

<!-- AD DAXİL ET MƏRHƏLƏSİ -->
<div id="welcome-modal" class="modal-overlay hidden">
    <div class="alert-card">
        <h3>🎮 Oyuna Başla</h3>
        <p>İstifadəçi adınızı yazın:</p>
        <input type="text" id="playerNameInput" placeholder="Nümunə: Qəhrəman...">
        <button onclick="oyuncuGiris()">Təsdiqlə</button>
    </div>
</div>

<!-- LİDERLƏR LÖVHƏSİ -->
<div id="leaderboard-modal" class="modal-overlay hidden">
    <div class="alert-card">
        <h3>🏆 Sizin Tərəqqiniz</h3>
        <div class="leaderboard-list" id="lbListArea"></div>
        <button onclick="liderleriBagla()" style="background: #475569;">Bağla</button>
    </div>
</div>

<script>
    let playerName = localStorage.getItem('rpg_player_name') || "";
    let bossLvl = parseInt(localStorage.getItem('rpg_boss_lvl')) || 1;
    let coin = parseInt(localStorage.getItem('rpg_coin')) || 0;
    let hp = parseInt(localStorage.getItem('rpg_hp')) || 100;
    let dmg = parseInt(localStorage.getItem('rpg_dmg')) || 10;
    
    let bossHp = 30 + (bossLvl - 1) * 20;
    let bossDmg = 10 + (bossLvl - 1) * 5;

    window.onload = function() {
        if (!playerName) {
            document.getElementById('welcome-modal').classList.remove('hidden');
        } else {
            document.getElementById('playerNameDisplay').innerText = playerName;
        }
        uiYenile();
    };

    function oyuncuGiris() {
        let name = document.getElementById('playerNameInput').value.trim();
        if (!name) return alert("Zəhmət olmasa ad yazın!");

        playerName = name;
        localStorage.setItem('rpg_player_name', playerName);
        document.getElementById('playerNameDisplay').innerText = playerName;
        document.getElementById('welcome-modal').classList.add('hidden');
        yaddaSaxla();
    }

    function yaddaSaxla() {
        localStorage.setItem('rpg_boss_lvl', bossLvl);
        localStorage.setItem('rpg_coin', coin);
        localStorage.setItem('rpg_hp', hp);
        localStorage.setItem('rpg_dmg', dmg);
    }

    function gucArtir() {
        if (coin >= 50) {
            coin -= 50;
            dmg += 5;
            hp += 20;
            alert("Gücünüz artdı! (+5 Hasar, +20 Can)");
            yaddaSaxla();
            uiYenile();
        } else {
            alert("Kifayət qədər qızılınız yoxdur! Bossu vurmaq üçün daha çox qızıl lazımdır.");
        }
    }

    function bossSavasi() {
        if (dmg >= bossHp) {
            bossLvl++;
            coin += 50;
            bossHp = 30 + (bossLvl - 1) * 20;
            bossDmg = 10 + (bossLvl - 1) * 5;

            // QƏLƏBƏ KONFETTİ EFFEKTİ
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            alert("🎉 Təbrik! Boss məğlub edildi! +50 Qızıl qazandınız.");
            yaddaSaxla();
            uiYenile();
        } else {
            alert("❌ Gücünüz yetmir! Bossun canı (" + bossHp + ") sizin hasarınızdan (" + dmg + ") çoxdur. Öncə 'Gücünü Artır' düyməsi ilə güclənin!");
        }
    }

    function sifirla() {
        if (confirm("Hesabı sıfırlayıb bütün tərəqqini silmək istəyirsiniz?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function uiYenile() {
        document.getElementById('coinCount').innerText = coin;
        document.getElementById('hpCount').innerText = hp;
        document.getElementById('dmgCount').innerText = dmg;
        document.getElementById('bossLvl').innerText = bossLvl;
        document.getElementById('bossHp').innerText = bossHp;
        document.getElementById('bossDmg').innerText = bossDmg;
    }

    function liderleriAc() {
        let listArea = document.getElementById('lbListArea');
        listArea.innerHTML = `
            <div class="lb-item">
                <span><b>1.</b> ${playerName || 'Oyuncu'}</span>
                <span style="color:#f59e0b;">Lvl ${bossLvl}</span>
            </div>
            <p style="font-size:12px; color:#94a3b8; text-align:center;">Tərəqqiniz brauzerdə saxlanılır.</p>
        `;
        document.getElementById('leaderboard-modal').classList.remove('hidden');
    }

    function liderleriBagla() { 
        document.getElementById('leaderboard-modal').classList.add('hidden'); 
    }
</script>
</body>
</html>
