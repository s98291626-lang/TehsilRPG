<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Təhsil RPG Oyunu</title>
    <!-- Konfetti Kitabxanası -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            text-align: center;
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #121826;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .player-badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #38bdf8; border: 1px solid #334155; }
        h2 { color: #f59e0b; margin: 5px 0 15px 0; font-size: 24px; }
        .stats { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-around; border: 1px solid #334155; font-size: 14px; font-weight: bold; }
        .box { background: #1a2234; padding: 15px; margin-top: 12px; border-radius: 12px; border: 1px solid #334155; text-align: left; }
        .box h3 { margin-top: 0; color: #38bdf8; font-size: 15px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 10px; border: none; outline: none; font-size: 14px; }
        input { background: #0f172a; color: #fff; border: 1px solid #334155; }
        button { background: #059669; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        
        /* Market Düymələri */
        .market-row { display: flex; gap: 8px; margin-top: 5px; }
        .btn-market { background: #d97706; font-size: 13px; padding: 8px; }

        /* GUI Mesaj Paneli */
        .game-log {
            background: #0f172a;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 45px;
            margin-top: 12px;
            border: 1px dashed #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .alert-card { background: #1e293b; padding: 22px; border-radius: 18px; width: 90%; max-width: 350px; border: 1px solid #334155; }
        .hidden { display: none !important; }
        .btn-danger { background: #dc2626 !important; }
        .choice-btn { background: #334155; margin: 4px 0; text-align: left; padding: 10px 12px; font-size: 13px; }
        .choice-btn:hover { background: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="player-badge">👤 <span id="playerNameDisplay">---</span></div>
        <button style="width: auto; padding: 6px 12px; font-size: 12px; background: #334155;" onclick="melumatGoster()">📊 Status</button>
    </div>

    <h2>🎯 Təhsil RPG</h2>
    
    <div class="stats">
        <span>🪙 <span id="coinCount">0</span></span>
        <span>❤️ <span id="hpCount">100</span></span>
        <span>⚔️ <span id="dmgCount">10</span></span>
    </div>

    <!-- MARKET BÖLMƏSİ (Qiymətlər hər alışda +5 artır) -->
    <div class="box" style="padding: 10px 15px;">
        <h3>🛒 Alqı-Satqı Marketi</h3>
        <div class="market-row">
            <button class="btn-market" onclick="canAl()">❤️ Can Al (+20)<br><span id="hpPriceText">10</span> Qızıl</button>
            <button class="btn-market" onclick="hasarAl()" style="background: #2563eb;">⚔️ Hasar Al (+5)<br><span id="dmgPriceText">10</span> Qızıl</button>
        </div>
    </div>

    <!-- SUAL BÖLMƏSİ -->
    <div class="box">
        <h3>📖 Təhsil Sualı (+5 Qızıl)</h3>
        <p id="questionText" style="font-size: 13px; margin-bottom: 8px;">Sual yüklənir...</p>
        <div id="choicesArea"></div>
    </div>

    <!-- BOSS BÖLMƏSİ -->
    <div class="box">
        <h3>👹 Boss Lvl <span id="bossLvl">1</span></h3>
        <p style="font-size: 12px; margin: 4px 0;">🔴 Boss Canı: <span id="bossHp">30</span> | 💥 Hasarı: <span id="bossDmg">10</span></p>
        <button onclick="bossSavasi()" class="btn-danger">⚔️ Boss ilə Savaş!</button>
    </div>

    <!-- GUI Mətn Ekranı -->
    <div class="game-log" id="gameLog">Oyuna xoş gəldin! Suallara cavab ver və ya marketdən güclən.</div>

    <button onclick="sifirla()" style="background: #7f1d1d; margin-top: 12px; font-size: 12px; padding: 6px;">🔄 Hesabı Sıfırla</button>
</div>

<!-- AD DAXİL ET MƏRHƏLƏSİ -->
<div id="welcome-modal" class="modal-overlay">
    <div class="alert-card">
        <h3>🎮 Oyuna Başla</h3>
        <p style="font-size: 14px; color: #94a3b8;">Qəhrəman adını daxil et:</p>
        <input type="text" id="playerNameInput" placeholder="Adını yaz...">
        <button onclick="oyuncuGiris()">Təsdiqlə</button>
    </div>
</div>

<script>
    // Suallar bazası (5 sual)
    const questions = [
        { q: "Azərbaycanın paytaxtı hansıdır?", choices: ["Gəncə", "Bakı", "Şəki", "Sumqayıt"], answer: 1 },
        { q: "2 + 2 * 2 nəyə bərabərdir?", choices: ["6", "8", "4", "10"], answer: 0 },
        { q: "Su hansı temperaturda qaynayır?", choices: ["90°C", "100°C", "80°C", "120°C"], answer: 1 },
        { q: "Dünyanın ən böyük okeanı hansıdır?", choices: ["Atlantik", "Hind", "Şaxtalı Buzlu", "Sakit okean"], answer: 3 },
        { q: "Kitabi-Dədə Qorqud dastanında əsas təpəgöz motivli boy hansıdır?", choices: ["Basatın Təpəgözü öldürdüyü boy", "Salong Oğlu Uruz", "Bamsı Beyrək"], answer: 0 }
    ];

    let currentQIndex = 0;
    let playerName = localStorage.getItem('rpg_player_name') || "";
    let bossLvl = parseInt(localStorage.getItem('rpg_boss_lvl')) || 1;
    let coin = parseInt(localStorage.getItem('rpg_coin')) || 0;
    let hp = parseInt(localStorage.getItem('rpg_hp')) || 100;
    let dmg = parseInt(localStorage.getItem('rpg_dmg')) || 10;
    
    // Market qiymətləri
    let hpPrice = parseInt(localStorage.getItem('rpg_hp_price')) || 10;
    let dmgPrice = parseInt(localStorage.getItem('rpg_dmg_price')) || 10;

    let bossHp = 30 + (bossLvl - 1) * 20;
    let bossDmg = 10 + (bossLvl - 1) * 5;

    window.onload = function() {
        if (!playerName) {
            document.getElementById('welcome-modal').classList.remove('hidden');
        } else {
            document.getElementById('playerNameDisplay').innerText = playerName;
        }
        uiYenile();
        sualYukle();
    };

    function logYaz(mesaj) {
        document.getElementById('gameLog').innerText = mesaj;
    }

    function oyuncuGiris() {
        let name = document.getElementById('playerNameInput').value.trim();
        if (!name) return logYaz("Zəhmət olmasa ad yazın!");
        playerName = name;
        localStorage.setItem('rpg_player_name', playerName);
        document.getElementById('playerNameDisplay').innerText = playerName;
        document.getElementById('welcome-modal').classList.add('hidden');
        yaddaSaxla();
        logYaz("Xoş gəldin, " + playerName + "! Macəra başladı.");
    }

    function yaddaSaxla() {
        localStorage.setItem('rpg_boss_lvl', bossLvl);
        localStorage.setItem('rpg_coin', coin);
        localStorage.setItem('rpg_hp', hp);
        localStorage.setItem('rpg_dmg', dmg);
        localStorage.setItem('rpg_hp_price', hpPrice);
        localStorage.setItem('rpg_dmg_price', dmgPrice);
    }

    function sualYukle() {
        let currentQ = questions[currentQIndex];
        document.getElementById('questionText').innerText = currentQ.q;
        let choicesArea = document.getElementById('choicesArea');
        choicesArea.innerHTML = "";

        currentQ.choices.forEach((choice, index) => {
            let btn = document.createElement('button');
            btn.className = "choice-btn";
            btn.innerText = (index + 1) + ") " + choice;
            btn.onclick = () => cavabYoxla(index, currentQ.answer);
            choicesArea.appendChild(btn);
        });
    }

    function cavabYoxla(secilen, dogru) {
        if (secilen === dogru) {
            coin += 5; // Hər doğru cavaba 5 coin
            logYaz("✅ Doğru! +5 Qızıl qazandın.");
            if(typeof confetti === 'function') confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        } else {
            logYaz("❌ Səhv cavab! Növbəti suala keç.");
        }
        yaddaSaxla();
        uiYenile();

        currentQIndex = (currentQIndex + 1) % questions.length;
        sualYukle();
    }

    // MARKET: Can almaq (qiymət hər dəfə +5 artır)
    function canAl() {
        if (coin >= hpPrice) {
            coin -= hpPrice;
            hp += 20;
            hpPrice += 5; // Qiymət 5 vahid artır
            logYaz("❤️ Can alındı! Canın +20 artdı.");
            yaddaSaxla();
            uiYenile();
        } else {
            logYaz("⚠️ Kifayət qədər qızılın yoxdur! (Lazım: " + hpPrice + ")");
        }
    }

    // MARKET: Hasar almaq (qiymət hər dəfə +5 artır)
    function hasarAl() {
        if (coin >= dmgPrice) {
            coin -= dmgPrice;
            dmg += 5;
            dmgPrice += 5; // Qiymət 5 vahid artır
            logYaz("⚔️ Hasar alındı! Hasarın +5 artdı.");
            yaddaSaxla();
            uiYenile();
        } else {
            logYaz("⚠️ Kifayət qədər qızılın yoxdur! (Lazım: " + dmgPrice + ")");
        }
    }

    // BOSS SAVAŞI (Güc çatmasa canın azalır!)
    function bossSavasi() {
        if (dmg >= bossHp) {
            bossLvl++;
            coin += 30;
            bossHp = 30 + (bossLvl - 1) * 20;
            bossDmg = 10 + (bossLvl - 1) * 5;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            logYaz("🎉 Boss məğlub edildi! Level " + bossLvl + " açıldı, +30 Qızıl!");
            yaddaSaxla();
            uiYenile();
        } else {
            // Güc çatmadıqda boss səni vurur, canın azalır!
            hp -= bossDmg;
            logYaz("💥 Gücün çatmadı! Boss səni vurdu və " + bossDmg + " can apardı!");
            
            if (hp <= 0) {
                logYaz("💀 Canın bitdi! Öldün və canın 100-ə bərpa olundu.");
                hp = 100;
            }
            yaddaSaxla();
            uiYenile();
        }
    }

    function sifirla() {
        if (confirm("Bütün tərəqqini silmək istəyirsən?")) {
            localStorage.clear();
            location.reload();
        }
    }

    function uiYenile() {
        document.getElementById('coinCount').innerText = coin;
        document.getElementById('hpCount').innerText = hp;
        document.getElementById('dmgCount').innerText = dmg;
        document.getElementById('bossLvl').innerText = bossLvl;
        document.getElementById('bossHp').innerText = bossHp;
        document.getElementById('bossDmg').innerText = bossDmg;
        document.getElementById('hpPriceText').innerText = hpPrice;
        document.getElementById('dmgPriceText').innerText = dmgPrice;
    }

    function melumatGoster() {
        logYaz("👤 " + playerName + " | Lvl: " + bossLvl + " | 🪙 " + coin);
    }
</script>
</body>
</html>
